<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ececec"/></marker><marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a7b0bd"/></marker><marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0fa3a3"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4c8bf5"/></marker><marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9b6dff"/></marker><marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e2892b"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5484d"/></marker></defs><text x="540.0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" font-style="normal" fill="#ececec" text-anchor="middle">One message-passing step (RecurrentCoupler)</text><text x="540.0" y="60" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" font-weight="400" font-style="normal" fill="#a7b0bd" text-anchor="middle">repeated N times as an explicit Euler update  h ← h + Δt · φ(ψ¹, …, ψⁿ)</text><rect x="40" y="150" width="224" height="130" rx="12" ry="12" fill="#4c8bf5" stroke="#4c8bf5" stroke-width="2.2" opacity="0.1"/><rect x="40" y="150" width="224" height="130" rx="12" ry="12" fill="none" stroke="#4c8bf5" stroke-width="2.2" opacity="1.0"/><text x="152.0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#4c8bf5" text-anchor="middle">1</text><text x="152.0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#ececec" text-anchor="middle">gather</text><text x="152.0" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#a7b0bd" text-anchor="middle">read coordinates h at each</text><text x="152.0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#a7b0bd" text-anchor="middle">port address of every edge</text><line x1="267" y1="215.0" x2="285" y2="215.0" stroke="#ececec" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="288" y="150" width="224" height="130" rx="12" ry="12" fill="#9b6dff" stroke="#9b6dff" stroke-width="2.2" opacity="0.1"/><rect x="288" y="150" width="224" height="130" rx="12" ry="12" fill="none" stroke="#9b6dff" stroke-width="2.2" opacity="1.0"/><text x="400.0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9b6dff" text-anchor="middle">2</text><text x="400.0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#ececec" text-anchor="middle">ξ  per class / port MLP</text><text x="400.0" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#a7b0bd" text-anchor="middle">apply edge & port-specific</text><text x="400.0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#a7b0bd" text-anchor="middle">MLP to  [ h_ports , x_e ]</text><line x1="515" y1="215.0" x2="533" y2="215.0" stroke="#ececec" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="536" y="150" width="224" height="130" rx="12" ry="12" fill="#e2892b" stroke="#e2892b" stroke-width="2.2" opacity="0.1"/><rect x="536" y="150" width="224" height="130" rx="12" ry="12" fill="none" stroke="#e2892b" stroke-width="2.2" opacity="1.0"/><text x="648.0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#e2892b" text-anchor="middle">3</text><text x="648.0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#ececec" text-anchor="middle">scatter-add → σ</text><text x="648.0" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#a7b0bd" text-anchor="middle">sum incoming messages</text><text x="648.0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#a7b0bd" text-anchor="middle">back onto each address a</text><line x1="763" y1="215.0" x2="781" y2="215.0" stroke="#ececec" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="784" y="150" width="224" height="130" rx="12" ry="12" fill="#0fa3a3" stroke="#0fa3a3" stroke-width="2.2" opacity="0.1"/><rect x="784" y="150" width="224" height="130" rx="12" ry="12" fill="none" stroke="#0fa3a3" stroke-width="2.2" opacity="1.0"/><text x="896.0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#0fa3a3" text-anchor="middle">4</text><text x="896.0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" font-style="normal" fill="#ececec" text-anchor="middle">φ  ·  Euler step</text><text x="896.0" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#a7b0bd" text-anchor="middle">h ← h + Δt · φ(messages)</text><text x="896.0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#a7b0bd" text-anchor="middle">loop for N steps</text><path d="M896.0 280 L896.0 326 L152.0 326 L152.0 280" fill="none" stroke="#9b6dff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowPurple)"/><text x="540.0" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#9b6dff" text-anchor="middle">updated coordinates  h  feed the next step</text><text x="540.0" y="108" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" font-weight="400" font-style="normal" fill="#ececec" text-anchor="middle">ψ(h, x)_a  =  σ ( Σ  ξᶜʳᵒ ( h_e , x_e ) )   over all edges incident to address a</text><text x="540.0" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#a7b0bd" text-anchor="middle">Equivariant by construction: it uses only gather / MLP / scatter-add — no address ordering.</text></svg>